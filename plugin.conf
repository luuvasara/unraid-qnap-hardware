# plugin.conf - what the shared plugin kit needs to know about this plugin.
NAME=qnap-hardware
TITLE="QNAP Hardware"
SUMMARY="A live overview of the QNAP TL-D1600S JBOD enclosure: front view and bay map, bay labels on the Main page, temperature history, a hardware inventory with known issues and firmware, and an anonymised hardware report."
PARENT=QnapHW
ABOUT_ORDER=5
REPO=https://github.com/luuvasara/unraid-qnap-hardware
EXEC="usr/local/emhttp/plugins/qnap-hardware/scripts/qnaphw-sample usr/local/emhttp/plugins/qnap-hardware/scripts/qnaphw-apply usr/local/emhttp/plugins/qnap-hardware/scripts/qnaphw-report"
ENCLOSURE_BADGES=yes
MORE=https://github.com/luuvasara/unraid-qnap-expansion
MORE_LABEL="QNAP Expansion, the companion plugin (card checks, Locate, cabling)"
