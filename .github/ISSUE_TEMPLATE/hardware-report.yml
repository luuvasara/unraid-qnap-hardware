name: Hardware report
description: A QNAP enclosure or card that the plugin does not recognise or draws wrong. Made with the plugin's Report tab.
title: "Hardware report: "
labels: ["hardware-report"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. The Report tab (Utilities, QNAP Hardware, Report) fills in the report below and anonymises it on your server before it reaches this page.
        Please read it once more before you submit: serial numbers, MAC addresses, WWNs, UUIDs, labels, the hostname, IP addresses and user names should all show as placeholders such as `<serial-1>`.
  - type: input
    id: model
    attributes:
      label: Enclosure and card
      description: As printed on the labels, e.g. "TL-D800S with QXP-800eS-A1164".
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What is missing or wrong?
      description: e.g. "the enclosure is not found", "HDD3 is shown in the wrong place".
    validations:
      required: true
  - type: textarea
    id: body
    attributes:
      label: Hardware report
      description: Filled in by the plugin. If the report was too long for a link, attach the downloaded qnap-hardware-report-*.txt here instead.
      render: text
    validations:
      required: true
